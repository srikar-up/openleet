name: 🐛 Bug Report
description: Report a bug with our clean user interface form.
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        ## 📋 SYSTEM INFORMATION

        Thanks for reporting a bug. Please search existing issues before opening a
        new one, and remove API keys, tokens, email addresses, and private paths
        from anything you paste.

  - type: input
    id: version
    attributes:
      label: App Version
      description: Run `openleet --version` and paste the exact output.
      placeholder: e.g. v0.5.0-beta
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating System
      options:
        - Windows
        - Linux
        - macOS
        - WSL
        - Other
    validations:
      required: true

  - type: input
    id: terminal
    attributes:
      label: Terminal and Size
      description: The terminal name and columns x rows, if relevant.
      placeholder: e.g. Windows Terminal 160x45
    validations:
      required: false

  - type: markdown
    attributes:
      value: |
        ## 💻 THE PROBLEM

  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which part of OpenLeet is affected?
      options:
        - Home
        - Roadmap
        - Solve workspace
        - Runner (Python / Go)
        - Coach / AI provider
        - Stats
        - Settings
        - Themes / appearance
        - Account / sync / leaderboard
        - Installer / release
        - Documentation
        - Other
    validations:
      required: true

  - type: textarea
    id: behavior
    attributes:
      label: What happened?
      placeholder: Describe what went wrong...
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      placeholder: |
        1. Go to...
        2. Click on...
        3. Scroll down to...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      placeholder: Describe what should have happened...
    validations:
      required: false

  - type: textarea
    id: evidence
    attributes:
      label: Screenshots or Logs
      description: Drag images here. Remove secrets and personal data first.
      render: text
    validations:
      required: false

  - type: markdown
    attributes:
      value: |
        ## ✅ VERIFICATION

  - type: checkboxes
    id: checks
    attributes:
      label: Verification
      options:
        - label: I am using the latest version of the app.
          required: true
        - label: I searched existing issues and did not find a duplicate.
          required: true
        - label: I removed API keys, tokens, email addresses, and private paths from this report.
          required: true
